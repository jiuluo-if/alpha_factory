[[templates]]
id = "toy_confirmation"
version = "2"
role = "PROBE_ALPHA"
kind = "economic"
family = "toy_confirmation"
expression = "rank(add(ts_zscore({p}, 5), ts_zscore({s}, 5)))"
required_slots = ["p", "s"]
stage_path = "toy:two-fields -> time-zscore -> add -> rank"
economic_mechanism = "TOY confirmation of two complementary information streams."
field_roles = ["toy_signal", "toy_confirmation"]
allowed_field_families = ["TOY_ONLY"]
field_relationship = "complementary toy signals"
direction = "long"
direction_reason = "The toy hypothesis expects aligned positive confirmation."
direction_transform = "identity"
expected_horizon = "one declared lattice profile"
falsification = "No aligned out-of-sample response across the declared profile."
self_correlation_impact = "UNKNOWN"
allowed_horizon_profiles = [[5, 22], [22, 66]]
allowed_settings_arms = ["BASE", "DECAY_DOWN", "DECAY_UP"]
mechanism_tags = ["TOY", "CONFIRMATION"]
novelty_family = "TOY_RELATION"
selection_groups = ["relationship", "candidate_scratch", "economic"]
selection_order = 30
[[templates.numeric_slots]]
name = "horizon"
kind = "RESEARCH_HORIZON"
default = 5
allowed_values = [5, 22, 66, 120, 255]
economic_role = "declared toy horizon"
token = "5"
occurrence = 0

[[templates]]
id = "toy_relative_change"
version = "2"
role = "PROBE_ALPHA"
kind = "economic"
family = "toy_relative_change"
expression = "group_neutralize(rank(ts_delta(subtract({p}, {s}), 5)), {g})"
required_slots = ["p", "s", "g"]
stage_path = "toy:relation -> delta -> rank -> group_neutralize"
economic_mechanism = "TOY relative change between two measurement roles, controlled by group."
field_roles = ["toy_numerator", "toy_denominator", "toy_group"]
allowed_field_families = ["TOY_ONLY"]
field_relationship = "toy numerator/denominator relation"
direction = "long"
direction_reason = "Positive relative change is the stated toy direction."
direction_transform = "identity"
expected_horizon = "one declared lattice profile"
falsification = "Relative change does not separate the toy comparison group out of sample."
self_correlation_impact = "UNKNOWN"
allowed_horizon_profiles = [[5, 22], [22, 66]]
allowed_settings_arms = ["BASE", "TRUNCATION_LOW", "TRUNCATION_HIGH"]
mechanism_tags = ["TOY", "RELATION", "GROUP_CONTROL"]
novelty_family = "TOY_RELATION"
selection_groups = ["relationship", "candidate_scratch", "economic"]
selection_order = 40
[[templates.numeric_slots]]
name = "horizon"
kind = "RESEARCH_HORIZON"
default = 5
allowed_values = [5, 22, 66, 120, 255]
economic_role = "declared toy horizon"
token = "5"
occurrence = 0

