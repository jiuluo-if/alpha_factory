name: Alpha Factory CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install ".[dev]"
      - name: Syntax layer
        run: python -m compileall -q wqb_agent scripts tests
      - name: Type layer
        run: >-
          python -m mypy
          wqb_agent/config.py
          wqb_agent/runtime_policy.py
          wqb_agent/runtime_components.py
          wqb_agent/runtime_composition.py
          wqb_agent/credentials.py
          wqb_agent/suggestion_workflow.py
          wqb_agent/alpha_feed_workflow.py
          wqb_agent/optimizer_workflow.py
          wqb_agent/alpha_color_workflow.py
      - name: Unit layer
        run: python -m unittest discover -s tests
      - name: Ruff
        run: python -m ruff check .
      - name: Coverage report
        run: coverage erase && coverage run --branch -m unittest discover -s tests && coverage report
      - name: Offline doctor
        run: python main.py --state-dir tests/fixtures state doctor
      - name: Offline state audit
        run: python main.py --state-dir tests/fixtures state audit
