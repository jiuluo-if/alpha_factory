# PUBLIC SYNTHETIC CATALOG ONLY. These toy examples are never a fallback for
# the local private research catalog and contain no research field IDs.

[[templates]]
id = "toy_control_rank"
version = "2"
role = "CONTROL_ALPHA"
kind = "baseline"
family = "toy_control"
expression = "rank({p})"
required_slots = ["p"]
stage_path = "toy:field -> cross_sectional_rank"
economic_mechanism = "TOY synthetic control for cross-sectional ordering."
field_roles = ["toy_signal"]
allowed_field_families = ["TOY_ONLY"]
field_relationship = "single toy field; control exception"
direction = "long"
direction_reason = "TOY direction only; not a research claim."
direction_transform = "identity"
expected_horizon = "TOY_UNSPECIFIED"
falsification = "Any toy fixture mismatch falsifies this control."
self_correlation_impact = "UNKNOWN"
allowed_horizon_profiles = []
allowed_settings_arms = ["BASE"]
mechanism_tags = ["TOY", "CONTROL"]
novelty_family = "TOY_CONTROL"
selection_groups = ["default", "factory_default", "candidate_scratch"]
selection_order = 10

