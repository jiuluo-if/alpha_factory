# Read-only built-in Alpha template catalog.


[[templates]]
id = "rank_level"
version = "1"
kind = "baseline"
family = "cross_sectional_rank"
expression = "rank({p})"
required_slots = ["p"]
stage_path = "L0:raw -> L1:cross_sectional -> L2:none"
economic_mechanism = "横截面排序，作为字段机制的最小基线。"
direction = "long"
direction_transform = "identity"
expected_horizon = "由 hypothesis 与字段频率共同确定"
falsification = "独立样本、健康或平台 checks 不能支持该结构时停止。"
self_correlation_impact = "unknown"
selection_groups = ["default", "factory_default", "reversal", "relationship", "momentum", "candidate_scratch"]
selection_order = 10

