name: Alpha Factory CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install .
      - name: Syntax layer
        run: python -m compileall -q wqb_agent scripts tests
      - name: Unit layer
        run: python -m unittest discover -s tests
      - name: Offline doctor
        run: python main.py --doctor --offline --state-dir tests/fixtures
      - name: Offline state audit
        run: python main.py --audit-state --offline --state-dir tests/fixtures
