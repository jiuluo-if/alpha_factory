[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-factory"
version = "0.8.0"
description = "Safety-first, state-driven Alpha research factory"
requires-python = ">=3.11"
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
dev = ["ruff", "coverage"]

[tool.setuptools]
packages = ["wqb_agent"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E741", "F401", "F821", "F841"]
